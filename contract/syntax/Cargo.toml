# Contract syntax: lexer, parser, AST, spans. Depends on `exact-motion` alone,
# whose word grammar reads an `animation` literal to find its keyframes name.
# @ref LLP 1004 D2.
[package]
name = "contract-syntax"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Contract syntax: indent-aware lexer, parser, and AST with spans"
publish = false

[lib]
name = "contract_syntax"
crate-type = ["rlib"]

[dependencies]
exact-motion = { path = "../../motion" }
