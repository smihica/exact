# What a push or pull request waits for: fmt, caps, boot, the workspace check and
# clippy on Linux, and the workspace check on macOS, where host/apple's Rust
# only builds. No test runs here. rules/RULES.md blocks on nothing slower than
# 60 seconds, and a hosted runner takes over an hour for the tests, so they are
# tests.yml's. Apple app builds, XCTests, simulator drives, Android and Windows
# builds are not part of CI.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every push to main gets its own result. A pull request's newer push replaces
# the run of the one before it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        # The Linux host's DRM/KMS, input and font dependencies.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libudev-dev libinput-dev libdrm-dev libgbm-dev \
            libxkbcommon-dev libfontconfig1-dev libfreetype-dev libwayland-dev

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: Swatinem/rust-cache@v2
        with:
          # A failed check still leaves what it compiled for the next run.
          cache-on-failure: true

      - name: Hermes bundle
        # Ordinary builds are offline (.cargo/config.toml); the installer fetches and
        # verifies Ibex's pinned, attested release bundle once.
        run: cargo run --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target x86_64-unknown-linux-gnu

      - name: Bun dependencies
        run: bun install --frozen-lockfile

      - name: Cargo dependencies
        # caps's wasm check lists and checks the web crates offline, so the registry
        # must already hold every crate, and nothing before this step fetches them.
        id: deps
        run: cargo fetch --locked

      # Each check runs once the setup above succeeded, whether or not a check before
      # it failed, so one run reports every failing check (rules/RULES.md bans
      # fail-fast), and the job fails if any did. A step's default condition,
      # `success()`, would skip it after any failure.
      - name: fmt
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo fmt --all -- --check

      - name: caps
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bun scripts/caps.mjs

      - name: boot
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: bun scripts/boot.mjs

      - name: workspace check
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo check --workspace --all-targets --keep-going

      - name: clippy
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: cargo clippy --all-targets --keep-going -- -D warnings

  macos:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Hermes bundle
        run: cargo run --manifest-path vendor/ibex/crates/hermes-lean-sys-installer/Cargo.toml -- --target aarch64-apple-darwin

      - name: Bun dependencies
        run: bun install --frozen-lockfile

      - name: workspace check
        run: cargo check --workspace --all-targets --keep-going
