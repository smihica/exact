[workspace]

[package]
name = "ibex2-sqlite"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
ibex2 = { path = "../ibex2", default-features = false }
# Apple's SQLite owns its filesystem locking probes; bundling SQLite brings
# statfs/fstatfs calls with no approved required-reason use into the app.
[target.'cfg(target_vendor = "apple")'.dependencies]
rusqlite = { version = "0.41.1", features = ["hooks", "limits", "extra_check"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
rusqlite = { version = "0.41.1", features = ["bundled", "hooks", "limits", "extra_check"] }

[dev-dependencies]
tempfile = "3"
