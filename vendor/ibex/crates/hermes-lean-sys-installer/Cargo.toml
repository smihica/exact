[workspace]

[package]
name = "hermes-lean-sys-installer"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "hermes-lean-sys-installer"
path = "src/main.rs"

[dependencies]
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls"] }

# Its own workspace takes none of the root's profiles: optimize dependencies as
# the root's dev profile does, or `--check` hashes each bundle with an
# unoptimized sha2, about nine seconds a target.
[profile.dev.package."*"]
opt-level = 3
