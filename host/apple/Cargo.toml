# The Apple host: the runner and kernel natively, laying out with Taffy and
# measuring text through a callback the app registers, running exact-motion,
# and emitting typed batches the AppKit and UIKit presenters apply.
#
# @ref LLP 1008 (this host) / LLP 1001 §6 (injected text measurement) /
# LLP 1002 D2, §4 (every non-web host runs exact-motion)
[package]
name = "exact-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Apple host: kernel tree → typed batches with layout frames and motion presentations, over a C ABI"
publish = false

[lib]
name = "exact_apple"
crate-type = ["rlib"]

[dependencies]
exact-data = { path = "../../data" }
exact-textflow = { path = "../../textflow" }
exact-color = { path = "../../color" }
exact-kernel = { path = "../../kernel" }
exact-markdown = { path = "../../markdown" }
# Which link destinations the Markdown editor hides (LLP 1045 D5) and each
# line's `auto` direction (D11): the web editor's rules, called only from
# `markup_exports!`.
exact-markdown-editor = { path = "../../markdown/editor" }
exact-motion = { path = "../../motion" }
exact-plan = { path = "../../plan" }
exact-route = { path = "../../route" }
exact-raster = { path = "../raster" }
exact-svg-file = { path = "../svg-file" }
exact-runner = { path = "../../runner" }
# The executor for a request that leaves the process (LLP 1016 D2).
exact-executor = { path = "../executor" }
# Its transport: ibex2's standard library for a Rust consumer (ibex LLP 0068)
# — no engine, no loader — taken from the sibling checkout, as Weird Castle
# takes exact2.
# `websocket`: the transport for an app's WebSockets (exactStream sockets); the
# vendored v4 crate gates it behind a default feature (27275f3d4), which
# default-features = false had turned off.
ibex2 = { path = "../../vendor/ibex/crates/ibex2", default-features = false, features = ["websocket"] }

serde_json = "1.0"
# A launch request's URL is checked before it is sent (src/launch_preloads.rs).
url = "2.5"

# Default features for registry crates already in this host's graph, which
# nothing here uses directly. An app crate that names one of them at its
# defaults would otherwise add features to it, and Cargo would rebuild it and
# every SDK crate above it: 3 to 35 units each. sdk-features.test.mjs keeps
# the list whole. A crate whose defaults bring a crate the graph lacks
# (cssparser, ff, icu_normalizer, p256) stays as it is: pinning it would cost
# every app that compile.
arcstr = "1.2"
arrayvec = "0.7"
crypto-bigint = "0.7"
ecdsa = "0.17"
elliptic-curve = "0.14"
# Through ibex2-sqlite, which app crates name beside this one.
foldhash = "0.2"
group = "0.14"
idna = "1"
litemap = "0.8"
memchr = "2"
percent-encoding = "2"
potential_utf = "0.1"
serde_core = "1"
slotmap = "1"
stable_deref_trait = "1"
subtle = "2"
tinystr = "0.8"
triomphe = "0.1"
writeable = "0.6"
yoke = "0.8"
zerofrom = "0.1"
zeroize = "1"
zerotrie = "0.2"

[dev-dependencies]
exact-logic = { path = "../../logic" }
caltrain = { path = "../../apps/caltrain" }
caltrain-data = { path = "../../apps/caltrain/data" }
contract = { path = "../../contract/cli" }
