# The Linux host: the painted host (`exact-painted`) on DRM/KMS dumb buffers
# with evdev input, the screen served over VNC, or headless. Pure Rust end
# to end: no system library is linked, so it builds on any Linux (and on
# macOS, headless, for the seconds-loop).
#
# @ref LLP 1015 (this host)
[package]
name = "exact-linux"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux host: the painted host on DRM/KMS with evdev input, over VNC, or headless"
publish = false

[lib]
name = "exact_linux"
crate-type = ["rlib"]

[dependencies]
exact-painted = { path = "../painted" }
exact-runner = { path = "../../runner" }
tiny-skia = "0.12"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
des = "0.8"
getrandom = "0.3"
drm = "0.15"
evdev = "0.13"

[features]
# Forward direct KMS presentation to the shared painter.
scanout = ["exact-painted/scanout"]

[dev-dependencies]
contract = { path = "../../contract/cli" }
exact-kernel = { path = "../../kernel" }
des = "0.8"
getrandom = "0.3"

[target.'cfg(unix)'.dev-dependencies]
# The KMS flip state and the VNC password tests run without a display on macOS too.
drm = "0.15"
