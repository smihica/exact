# The Canvas gallery on Apple platforms (LLP 1056 §4): the host's C exports
# over its TypeScript data module and baked plan.
[package]
name = "canvas-gallery-apple"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lib]
crate-type = ["rlib"]
test = false
bench = false

[dependencies]
canvas-gallery-data = { path = "../data" }
ibex2-sqlite = { path = "../../../vendor/ibex/crates/ibex2-sqlite" }
exact-logic = { path = "../../../logic" }
exact-apple = { path = "../../../host/apple" }
exact-js = { path = "../../../js" }

[build-dependencies]
canvas-gallery-data = { path = "../data" }
exact-js-bake = { path = "../../../js/bake" }
